name: safebite_app
description: "SafeBite - AI-Driven Food Ingredient Analysis App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.8.1

  # State Management
  provider: ^6.1.5

  # HTTP & API
  http: ^1.2.2
  crypto: ^3.0.6
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0

  # Storage
  shared_preferences: ^2.2.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/datasets/
